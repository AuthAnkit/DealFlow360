# =========================================================================
# DealFlow360 - application configuration
# =========================================================================
# Server
server.port=8080
# Include the reason text of an error in the JSON body - the frontend shows it to the user.
# (GlobalExceptionHandler already does this for the API; this covers anything that slips past it.)
server.error.include-message=always

# -------------------------------------------------------------------------
# DATABASE - PostgreSQL (default)
# Create the database first:
#   psql -U postgres -c "CREATE DATABASE \"dealflow360-db\";"
# -------------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/dealflow360-db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# -------------------------------------------------------------------------
# DATABASE - MySQL (alternative)
# To use MySQL instead: comment the PostgreSQL block above and uncomment
# the 3 lines below. Create the database first:
#   mysql -u root -p -e "CREATE DATABASE \`dealflow360-db\`;"
# -------------------------------------------------------------------------
#spring.datasource.url=jdbc:mysql://localhost:3306/dealflow360-db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
#spring.datasource.username=root
#spring.datasource.password=root
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -------------------------------------------------------------------------
# JPA / Hibernate
# ddl-auto=update -> Hibernate creates/updates tables automatically on startup.
# -------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# For MySQL, hibernate needs the correct dialect (auto-detected in most cases,
# uncomment if needed):
#spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# -------------------------------------------------------------------------
# Jackson
# -------------------------------------------------------------------------
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.default-property-inclusion=non_null

# -------------------------------------------------------------------------
# Logging
# -------------------------------------------------------------------------
logging.level.com.dealflow360=INFO

# -------------------------------------------------------------------------
# File upload (PDF import automation feature - Import from PDF on a quotation)
# -------------------------------------------------------------------------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# -------------------------------------------------------------------------
# Automation (background jobs - see AutomationScheduler)
# How often the self-governing background jobs run: stalled-deal nudges,
# backorder consolidation, low-stock flags. 3 minutes is snappy enough for
# a live demo without hammering the database.
# -------------------------------------------------------------------------
dealflow360.automation.interval-ms=180000
